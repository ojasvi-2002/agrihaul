# Render Blueprint — deploys the whole app (database + backend + frontend)
# from one file, under one Render account. See README.md §13 for the
# step-by-step walkthrough (Twilio setup, first-deploy URL fixups, etc.).
#
# All three services use Render's free plan — $0, no card required to
# create them. The free Postgres database expires after a while on the
# free plan (Render's docs are inconsistent on the exact window, 30-90
# days) and needs recreating; fine for demoing, not for a real customer.

databases:
  - name: agrihaul-db
    plan: free
    databaseName: agrihaul
    user: agrihaul

services:
  - name: agrihaul-backend
    type: web
    runtime: node
    plan: free
    # Installs root deps (Prisma/pg — see backend/src/lib/prisma.ts for
    # why those live at the repo root, not in backend/package.json),
    # then backend's own deps, generates the Prisma client, applies any
    # pending migrations, then compiles TypeScript.
    #
    # --include=dev is required here even though NODE_ENV=production is
    # set below: npm normally skips devDependencies (typescript, @types/*)
    # whenever NODE_ENV=production is set, which breaks the `tsc` build
    # step itself. NODE_ENV=production still applies at runtime as normal
    # (this only affects what `npm install` fetches during the build).
    buildCommand: >-
      npm install --include=dev &&
      cd backend && npm install --include=dev && cd .. &&
      npx prisma generate --schema=database/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=database/prisma/schema.prisma &&
      cd backend && npm run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agrihaul-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      # Render sits in front of this service as a single reverse proxy —
      # see env.ts's comment on why this must match that exactly.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Placeholders — Render assigns the real subdomain on first deploy
      # (only guaranteed to match this if the name below is available).
      # Update these three to the actual URLs after the first deploy;
      # see README.md §13.
      - key: CORS_ORIGIN
        value: https://agrihaul-frontend.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://agrihaul-backend.onrender.com
      # Secrets — sync: false means Render prompts you to type these in
      # yourself when the blueprint is first created, and never stores
      # them in this file or the repo.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  - name: agrihaul-frontend
    type: web
    runtime: static
    # --include=dev — same reasoning as the backend service above: Render
    # defaults NODE_ENV to production for builds too, which would
    # otherwise skip vite/typescript (both devDependencies) and break
    # this build before it starts.
    buildCommand: cd frontend && npm install --include=dev && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Placeholder — see the backend's CORS_ORIGIN comment above; update
      # after the first deploy if the backend's assigned URL differs.
      - key: VITE_API_URL
        value: https://agrihaul-backend.onrender.com
    routes:
      # SPA fallback — React Router handles routing client-side, so every
      # path needs to actually serve index.html rather than 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
